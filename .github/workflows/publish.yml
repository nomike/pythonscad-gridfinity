# Publishing prerequisites:
# 1. Create GitHub environments named "testpypi" and "pypi".
# 2. Register trusted publishers on TestPyPI and PyPI with:
#    owner=nomike, repository=pythonscad-gridfinity, workflow=publish.yml,
#    and the corresponding environment name.
# 3. Allow GitHub Actions to create pull requests for release-please.
# No package-index token is stored as a GitHub secret; publishing uses OIDC.
name: Release and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.repository == 'nomike/pythonscad-gridfinity' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-development:
    needs: release-please
    if: needs.release-please.outputs.release-created != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test the locked source tree
        run: |
          uv sync --frozen --all-groups
          uv run pytest
          uv run pyright
      - name: Set unique development version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          content = path.read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "(\d+)\.(\d+)\.(\d+)"$', content)
          if match is None:
              raise SystemExit("Could not find a stable project version")
          major, minor, patch = map(int, match.groups())
          version = f"{major}.{minor}.{patch + 1}.dev{os.environ['RUN_NUMBER']}"
          content = content[:match.start()] + f'version = "{version}"' + content[match.end():]
          path.write_text(content, encoding="utf-8")
          print(f"Building development version {version}")
          PY
      - name: Build and verify distributions
        run: |
          uv build
          uvx --from twine==7.0.0 twine check dist/*
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/python -c \
            "import gridfinity; print(gridfinity.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: development-distributions
          path: dist/
          if-no-files-found: error

  publish-development:
    needs: build-development
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: development-distributions
          path: dist/
      - name: Publish development version to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test the release source tree
        run: |
          uv sync --frozen --all-groups
          uv run pytest
          uv run pyright
      - name: Build and verify distributions
        run: |
          uv build
          uvx --from twine==7.0.0 twine check dist/*
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/python -c \
            "import gridfinity; print(gridfinity.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  attach-release-assets:
    needs: [release-please, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-distributions
          path: dist/
      - name: Attach wheel and source distribution
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-please.outputs.tag-name }}
          files: dist/*
          fail_on_unmatched_files: true

  publish-release-testpypi:
    needs: build-release
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-distributions
          path: dist/
      - name: Publish release to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-release-pypi:
    needs: [build-release, publish-release-testpypi, attach-release-assets]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-distributions
          path: dist/
      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
